[project]
name = "contratos-core"
version = "0.1.0"
description = "Shared ORM models, settings and session factory."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.54,<2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
# The suite needs no database and no container: pytest on a venv is the whole
# of it. Lives here because api and ingest both depend on this package.
test = ["pytest>=8.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contratos_core*"]
