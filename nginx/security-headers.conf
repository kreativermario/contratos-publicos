# add_header in a location REPLACES the inherited set, so this file is included
# in every location that adds headers of its own. Do not "tidy" it away.
# TLS terminates at haproxy, so nginx itself only ever speaks plain HTTP. The
# header still belongs here rather than there: this is where the rest of the
# response headers are version-controlled, and a user agent is required to
# ignore HSTS arriving over a non-secure transport, so sending it unconditionally
# is safe even if someone reaches this container directly.
#
# No `preload`. Preloading is a submission to a list baked into browser binaries
# and is slow and painful to undo; two years of max-age with includeSubDomains
# is what a scanner asks for and what this deployment can actually honour.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options   "nosniff"                       always;
add_header X-Frame-Options          "DENY"                          always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                 always;
add_header Cross-Origin-Resource-Policy "same-origin"               always;
# The page's own CSP is a meta tag emitted by SvelteKit with a script hash.
# frame-ancestors cannot live in a meta tag, so it is set here.
add_header Content-Security-Policy  "frame-ancestors 'none'"        always;
