name: tests

# The seams nothing else watches. A FastAPI router is imported for the first
# time when a request arrives, and `svelte-check` reads types rather than
# strings, so without this a drifted signature 500s every contracts request in
# production and a missing message key prints itself on the page.
#
# Callable, because the deploy gates on it: a green run is what earns a push to
# the box. That is also why there is no `push: main` trigger here, which would
# only run the same suite twice on every merge.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: core, api, ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Hash-locked, like the images; regenerate with scripts/lock-python.sh.
      - name: Install the three packages
        run: |
          pip install --require-hashes -r requirements-test.txt
          pip install --no-deps --no-build-isolation -e ./core -e ./api -e ./ingest

      # testpaths and the database URL live in pytest.ini and conftest.py, so
      # this runs the same way here as it does on a laptop.
      - run: pytest

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # svelte-check, then the two string checks it cannot see: message parity
      # across both languages, and the canonical/hreflang pair.
      - run: npm run check

      # The build is the last gate: it is what the image runs, and a prerender
      # failure in the sitemap only shows up here.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://ondevaiparar.com
