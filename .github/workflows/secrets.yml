name: secrets

# The pre-commit hook is opt-in per clone and `--no-verify` bypasses it, so the
# scan runs here too. This is the one that actually gates the branch.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A key can be published long after the commit that leaked it; re-scan the
    # whole history weekly against gitleaks' newer rules.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: a secret removed in a later commit is still published
          fetch-depth: 0

      - name: Scan history for secrets
        # pinned, never :latest, same rule as the runtime images
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 .
