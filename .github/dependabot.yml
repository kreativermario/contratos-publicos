# Everything is pinned (actions by SHA, images by digest, Python by hash, npm by
# lockfile integrity), so a pin only moves when one of these PRs is merged.
#
# The cooldown is the supply-chain half: a hijacked release is usually caught
# and yanked within days, and a week's wait means it is gone before a PR for it
# ever opens. Security updates are not subject to it.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      images: {patterns: ["*"]}

  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      compose: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      web: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      # Kit 3 is a migration ($lib is removed, tsconfig changes), not a bump.
      - dependency-name: "@sveltejs/*"
        update-types: [version-update:semver-major]
      # svelte-check@4 peers typescript ^5 || ^6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The requirements files are generated by scripts/lock-python.sh; a PR here
  # bumps one package and its hashes. For a full re-resolve, run the script.
  - package-ecosystem: pip
    directories: [/, /api, /ingest]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      python: {patterns: ["*"]}
    ignore:
      # core pins <2.1; 2.1 wants a real test against a database first.
      - dependency-name: sqlalchemy
        update-types: [version-update:semver-minor]
