<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Unfurlers (Discord, WhatsApp, Signal, Slack, Telegram) never run JS, and
		     this app is ssr:false, so every tag a preview needs has to live here in
		     the shell rather than in <svelte:head>. That also means one preview for
		     the whole site: a link to ?nif=... unfurls the same as the root. Making
		     it per-municipality would need prerendered routes or SSR.

		     The origin has to be absolute for og:image and og:url, and it is not
		     written here: %sveltekit.env.PUBLIC_SITE_URL% is substituted at build
		     time from the environment (default in vite.config.ts).

		     The shell is one file for both languages, so the tags below describe
		     the Portuguese root and the hreflang pair points at both trees.
		     `<html lang>` is corrected per route in +layout.svelte. -->
		<title>Onde Vai Parar</title>
		<meta name="description" content="Quem recebe o dinheiro das câmaras municipais portuguesas, e com qual procedimento." />
		<link rel="canonical" href="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<link rel="alternate" hreflang="pt-PT" href="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<link rel="alternate" hreflang="en" href="%sveltekit.env.PUBLIC_SITE_URL%/en" />
		<link rel="alternate" hreflang="x-default" href="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<meta name="theme-color" content="#fff5d8" />

		<meta property="og:site_name" content="Onde Vai Parar" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pt_PT" />
		<meta property="og:locale:alternate" content="en_GB" />
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<meta property="og:title" content="Onde Vai Parar" />
		<meta property="og:description" content="Quem recebe o dinheiro das câmaras municipais portuguesas, e com qual procedimento." />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Onde Vai Parar: quem recebe o dinheiro das câmaras municipais." />

		<!-- summary_large_image is what makes Discord render the wide card rather
		     than a thumbnail beside the text. -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Onde Vai Parar" />
		<meta name="twitter:description" content="Quem recebe o dinheiro das câmaras municipais portuguesas, e com qual procedimento." />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og.png" />

		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧿</text></svg>" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<link rel="preload" href="/fonts/taiPGmVuC4y96PFeqp8sqomI_L8zYK8.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
