# Every service: non-root, read-only root filesystem, no new privileges, all
# capabilities dropped. Writes go to tmpfs or a named volume, never the rootfs.
# Development only. Production is docker-compose.prod.yml, on rootless podman
# behind a Cloudflare tunnel; nginx speaks plain HTTP on 8080 in both.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  # No db-init one-shot: a fresh named volume inherits the ownership of the
  # image directory it mounts over, and /var/lib/postgresql is the image's own
  # declared VOLUME, shipped owned 70:70. Mounting one level down at
  # .../data, which the image does not have, is what used to leave the volume
  # root-owned and needed a root container to chown it. Same in
  # docker-compose.prod.yml, where the long version of this is written out.
  db:
    <<: *hardening
    image: postgres:18-alpine3.24
    user: "70:70"                      # postgres uid in the alpine variant
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
    tmpfs:
      # tmpfs mounts arrive root-owned; postgres runs as uid 70.
      - /tmp:uid=70,gid=70,mode=1777
      - /run:uid=70,gid=70,mode=0755
      - /var/run/postgresql:uid=70,gid=70,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    expose: ["5432"]

  api:
    <<: *hardening
    build:
      context: ./api
      dockerfile: ../docker/api.Dockerfile
      additional_contexts:
        core: ./core
    user: "10001:10001"
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    tmpfs: ["/tmp"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    <<: *hardening
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
      additional_contexts:
        nginxconf: ./nginx
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ondevaiparar.com}
    user: "101:101"
    depends_on: [api]
    environment:
      # envsubst renders the template into conf.d at startup
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-api:8000}
      NGINX_TRUSTED_PROXY: ${NGINX_TRUSTED_PROXY:-0.0.0.0/0}
      # No Cloudflare in front locally, so the header the real-ip module reads
      # is the one a local proxy would set. Production overrides it.
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-X-Forwarded-For}
      NGINX_API_RATE: ${NGINX_API_RATE:-20r/s}
      NGINX_API_BURST: ${NGINX_API_BURST:-60}
      NGINX_COMPANY_RATE: ${NGINX_COMPANY_RATE:-30r/m}
      NGINX_COMPANY_BURST: ${NGINX_COMPANY_BURST:-15}
    tmpfs:
      # tmpfs mounts default to root ownership; nginx runs as uid 101, so each
      # one it must write to needs the owner set explicitly.
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755   # envsubst renders here
    ports: ["${WEB_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot. Run on a cron/timer from the host:
  #   docker compose run --rm ingest impic
  #   docker compose run --rm ingest delta
  ingest:
    <<: *hardening
    restart: "no"
    build:
      context: ./ingest
      dockerfile: ../docker/ingest.Dockerfile
      additional_contexts:
        core: ./core
    user: "10001:10001"
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    tmpfs: ["/tmp"]
    volumes:
      - ingestdata:/data          # multi-hundred-MB downloads; tmpfs would be RAM
    profiles: ["tools"]

volumes:
  pgdata: {}
  ingestdata: {}
